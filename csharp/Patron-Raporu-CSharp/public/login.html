<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Ensari POS Patron - Giriş</title>
<style>
  :root{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--surface-2:#232322;--line:rgba(255,255,255,.10);--ink:#ffffff;--ink-2:#c3c2b7;--muted:#898781;--accent:#3987e5;--critical:#d03b3b}
  :root[data-theme="light"]{color-scheme:light;--bg:#f4f4f2;--surface:#ffffff;--surface-2:#f1f1ee;--line:rgba(11,11,11,.10);--ink:#0b0b0a;--ink-2:#4b4a45;--muted:#83817a;--accent:#2a78d6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .logo img{width:34px;height:34px;border-radius:9px}
  h1{margin:0;font-size:19px;font-weight:600}
  p.sub{margin:6px 0 22px;color:var(--muted);font-size:13px}
  label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
  .field{position:relative;margin-bottom:14px}
  input{width:100%;min-height:48px;padding:12px 44px 12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .toggle{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .toggle svg{width:19px;height:19px}
  button.primary{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--accent);color:#06121f;font:inherit;font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation}
  button.primary:disabled{opacity:.6}
  .err{margin:0 0 14px;padding:11px 13px;border-radius:12px;background:rgba(208,59,59,.13);border:1px solid rgba(208,59,59,.35);color:#f6c9c9;font-size:13px}
  .err[hidden]{display:none}
  .hint{margin-top:16px;color:var(--muted);font-size:11.5px;text-align:center}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
  .shake{animation:shake .4s}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('patron-theme')||'dark'}catch(e){}</script>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="logo"><img src="/icon.svg" alt=""><h1>Ensari POS Patron</h1></div>
  <p class="sub">Devam etmek için e-posta ve şifrenizi girin.</p>
  <p class="err" id="err" hidden></p>
  <div class="field">
    <label for="email">E-posta</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" placeholder="ornek@eposta.com" autofocus>
  </div>
  <div class="field">
    <label for="password">Şifre</label>
    <input id="password" name="password" type="password" inputmode="text" autocomplete="current-password">
    <button type="button" class="toggle" id="toggle" aria-label="Şifreyi göster">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <button type="submit" class="primary" id="submit">Giriş yap</button>
  <p class="hint">Şifreni unuttun mu? Bilgisayardaki kurulum ekibiyle iletişime geç.</p>
</form>
<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';
  $('toggle').onclick = () => {
    const field = $('password');
    field.type = field.type === 'password' ? 'text' : 'password';
  };
  $('form').addEventListener('submit', async event => {
    event.preventDefault();
    const errBox = $('err'), submit = $('submit'), password = $('password').value, email = $('email').value.trim();
    errBox.hidden = true;
    if (!email || !password) { errBox.textContent = 'E-posta ve şifre gerekli.'; errBox.hidden = false; return; }
    submit.disabled = true; submit.textContent = 'Kontrol ediliyor…';
    try {
      const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Giriş başarısız.');
      location.href = next;
    } catch (error) {
      errBox.textContent = error.message; errBox.hidden = false;
      $('form').classList.remove('shake'); void $('form').offsetWidth; $('form').classList.add('shake');
      $('password').select();
    } finally { submit.disabled = false; submit.textContent = 'Giriş yap'; }
  });
</script>
</body>
</html>
