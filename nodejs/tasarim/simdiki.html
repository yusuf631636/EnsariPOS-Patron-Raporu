<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script src="ornek-veri.js"></script>
<script>
  document.getElementById('summaryBox').innerHTML = renderSnapshot(ORNEK.data, ORNEK.updatedAt);
  document.querySelectorAll('.snap-section').forEach(el => { el.hidden = el.dataset.section !== 'genel'; });
</script>
